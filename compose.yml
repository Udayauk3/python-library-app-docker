---
services:
  db:
    image: udaygoud06/pyapp:dbimg
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - mynet

  auth_service:
    image: udaygoud06/pyapp:authimg
    ports:
      - "5001:5001"
    deploy:
      replicas: 2
    networks:
      - mynet
    depends_on:
      - db

  book_service:
    image: udaygoud06/pyapp:bookimg
    ports:
      - "5002:5002"
    deploy:
      replicas: 2
    networks:
      - mynet
    depends_on:
      - db  

  borrow_service :
    image: udaygoud06/pyapp:borrowimg
    ports:
      - "5003:5003"
    deploy:
      replicas: 2
    networks:
      - mynet
    depends_on:
      - db

  frontend:
    image: udaygoud06/pyapp:mainimg
    ports:
      - "5000:5000"
    deploy:
      replicas: 2
    networks:
      - mynet
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynet:
    driver: overlay
